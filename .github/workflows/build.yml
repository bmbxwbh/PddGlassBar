name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read        # miuix 走 GitHub Packages, 必须可读 packages

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # settings.gradle.kts 从环境读取 miuix 私仓凭据(GitHub Packages 对公开包也强制鉴权)
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Build standard + legacy flavors
        run: >
          gradle --no-daemon --stacktrace
          :app:assembleStandardRelease :app:assembleLegacyRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PddGlassBar-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
